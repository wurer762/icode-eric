---
# tasks file for common
- name: Install common and group-specific packages
  ansible.builtin.apt:
    name: "{{ common_packages + extra_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the time zone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Write the message of the day
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"

- name: Create the admins group
  ansible.builtin.group:
    name: admins
    state: present

- name: Manage admin accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment }}"
    groups: admins
    append: true
    shell: /bin/bash
    state: "{{ item.state | default('present') }}"
    remove: "{{ item.state | default('present') == 'absent' }}"
  loop: "{{ admins }}"

- name: Authorize SSH keys of current admins
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ lookup('ansible.builtin.file', item.name + '.pub') }}"
    state: present
  loop: "{{ admins }}"
  when: item.state | default('present') == 'present'

- name: Allow the admins group to use sudo without password
  ansible.builtin.copy:
    dest: /etc/sudoers.d/admins
    content: "%admins ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Forbid SSH login as root
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: PermitRootLogin no
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH
