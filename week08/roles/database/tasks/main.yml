---
# tasks file for database
- name: Install MariaDB and the Python driver Ansible needs
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Make sure MariaDB is running and enabled
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Listen on the network, not only on localhost
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address'
    line: "bind-address = {{ db_bind_address }}"
  notify: Restart MariaDB

- name: Create the application database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create the application user for each web server
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "{{ hostvars[item]['ansible_host'] }}"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  loop: "{{ groups[db_client_group] }}"
  no_log: true

- name: Remove the account that accepted logins from any host
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    host: "%"
    state: absent
    login_unix_socket: /run/mysqld/mysqld.sock
