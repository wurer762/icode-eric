---
- name: Quick fixes on the web servers
  hosts: web
  become: true
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Check the nginx version
      ansible.builtin.command: nginx -v
      register: nginx_version
      changed_when: false

    - name: Write a test page
      ansible.builtin.copy:
        content: "test\n"
        dest: /var/www/icode/test.html
        owner: root
        group: root
        mode: "0644"

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
