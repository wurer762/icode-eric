---
# tasks file for webserver
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the web root
  ansible.builtin.file:
    path: /var/www/icode
    state: directory
    mode: "0755"

- name: Deploy the start page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/icode/index.html
    mode: "0644"

- name: Deploy the nginx site configuration
  ansible.builtin.template:
    src: icode-site.conf.j2
    dest: /etc/nginx/sites-available/icode
    mode: "0644"
  notify: Reload nginx

- name: Enable the icode site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/icode
    dest: /etc/nginx/sites-enabled/icode
    state: link
  notify: Reload nginx

- name: Disable the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Make sure nginx is running and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
